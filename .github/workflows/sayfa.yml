name: Tanıtım sayfası

# Ana sayfa (indirme bağlantılarıyla birlikte) GitHub Pages'te yayımlanır.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/sayfa.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sayfa
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        env:
          SENTIO_TABAN: /${{ github.event.repository.name }}/
        run: |
          npm run build:tanitim
          cp dist-tanitim/index.html dist-tanitim/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-tanitim

  yayimla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v4
