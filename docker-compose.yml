services:
  sentio:
    build: .
    image: sentio:yerel
    ports:
      - "5757:5757"
    volumes:
      - sentio-veri:/veri
    environment:
      # Öğrencilere gösterilecek adres; https ile yayınlıyorsanız buraya yazın.
      # Sentio__GenelAdres: "https://sentio.okulunuz.edu.tr"
      Sentio__VeriSaklamaGun: "180"
    restart: unless-stopped

volumes:
  sentio-veri:
